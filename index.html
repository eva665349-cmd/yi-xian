<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="一现">
  <meta name="apple-mobile-web-app-title" content="一现">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./site.webmanifest">
  <title>一现 · 待办与进展</title>
  <meta name="description" content="一个简洁的待办与想法进展记录本。">
  <style>
    :root {
      --ink: #111111;
      --muted: #666666;
      --faint: #9a9a9a;
      --paper: #ffffff;
      --paper-light: #ffffff;
      --line: rgba(0, 0, 0, .14);
      --accent: #111111;
      --accent-soft: rgba(0, 0, 0, .06);
      --shadow: rgba(0, 0, 0, .12);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--paper);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select { font: inherit; }

    button { color: inherit; }

    button,
    a,
    label,
    select { touch-action: manipulation; }

    .shell {
      width: min(816px, 100%);
      margin: 0 auto;
      padding: 64px 18px 90px;
      position: relative;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 0 2px 23px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: block;
      margin-bottom: 9px;
      color: var(--accent);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -.05em;
    }

    .summary {
      padding-bottom: 2px;
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
      white-space: nowrap;
    }

    .page-nav {
      display: flex;
      gap: 26px;
      padding: 15px 2px 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 13px;
    }

    .page-nav a {
      position: relative;
      padding: 4px 0 10px;
      color: var(--muted);
      text-decoration: none;
    }

    .page-nav a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 1px;
      background: var(--accent);
      opacity: 0;
      transform: scaleX(.5);
      transition: opacity .18s ease, transform .18s ease;
    }

    .page-nav a.is-active { color: var(--ink); }

    .page-nav a.is-active::after {
      opacity: 1;
      transform: scaleX(1);
    }

    .view[hidden] { display: none; }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px auto;
      gap: 12px;
      margin: 30px 0 39px;
    }

    .composer input,
    .note-form input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      outline: 0;
      background: transparent;
      color: var(--ink);
      border-radius: 0;
      transition: border-color .2s ease, background .2s ease;
    }

    .composer input {
      min-height: 46px;
      padding: 5px 3px;
      font-size: 18px;
    }

    .composer input:focus,
    .note-form input:focus {
      border-color: var(--accent);
    }

    .composer select,
    .task-category-select {
      border: 0;
      border-bottom: 1px solid var(--line);
      outline: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
    }

    .composer select {
      width: 112px;
      padding: 0 2px;
    }

    .composer select:focus,
    .task-category-select:focus { border-color: var(--accent); }

    input::placeholder { color: var(--faint); }

    .add-button {
      align-self: center;
      min-width: 92px;
      padding: 10px 17px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .06em;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .add-button:hover {
      background: #000000;
      box-shadow: 0 5px 14px var(--shadow);
      transform: translateY(-1px);
    }

    .add-button:active { transform: translateY(0); }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task {
      position: relative;
      padding: 0 1px 33px;
      animation: settle .32s ease both;
    }

    .task + .task {
      padding-top: 27px;
      border-top: 1px solid var(--line);
    }

    .task-head {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: baseline;
      gap: 11px;
    }

    .check-wrap {
      position: relative;
      align-self: start;
      width: 20px;
      height: 20px;
      margin-top: 2px;
    }

    .check-wrap input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }

    .checkmark {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1.5px solid #222222;
      border-radius: 3px;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .checkmark::after {
      content: "";
      width: 8px;
      height: 4px;
      margin-top: -2px;
      border-left: 1.7px solid white;
      border-bottom: 1.7px solid white;
      opacity: 0;
      transform: rotate(-45deg) scale(.4);
      transition: opacity .15s ease, transform .18s ease;
    }

    .check-wrap input:checked + .checkmark {
      border-color: var(--accent);
      background: var(--accent);
    }

    .check-wrap input:checked + .checkmark::after {
      opacity: 1;
      transform: rotate(-45deg) scale(1);
    }

    .check-wrap input:focus-visible + .checkmark {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    .task-title {
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: text;
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.5;
      text-align: left;
      overflow-wrap: anywhere;
      text-decoration-thickness: 1px;
      text-decoration-color: #8a8a8a;
      transition: color .2s ease;
    }

    .task-title-slot { min-width: 0; }

    .task-title[hidden] { display: none; }

    .task-title:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 4px;
    }

    time {
      color: var(--faint);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .015em;
      white-space: nowrap;
      transition: color .2s ease;
    }

    .time-knot {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding-left: 18px;
    }

    .time-knot::before {
      content: "";
      position: absolute;
      left: 6px;
      top: -3px;
      width: 1px;
      height: calc(100% + 6px);
      background: currentColor;
      opacity: .42;
    }

    .time-knot::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 50%;
      width: 6px;
      height: 6px;
      border: 1px solid var(--accent);
      border-radius: 50% 50% 50% 0;
      background: var(--paper);
      box-shadow: 0 0 0 2px var(--paper);
      transform: translateY(-50%) rotate(45deg);
      transition: border-color .2s ease;
    }

    .task-timeline {
      position: relative;
      margin: 7px 0 0 48px;
      padding-left: 20px;
    }

    .task-timeline::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 1px;
      bottom: 1px;
      width: 1px;
      background: var(--faint);
      opacity: .48;
      transition: background .2s ease;
    }

    .timeline-row,
    .task-timeline .note {
      position: relative;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      min-height: 20px;
    }

    .timeline-row::before,
    .task-timeline .note::before {
      content: "";
      position: absolute;
      left: -18px;
      width: 6px;
      height: 6px;
      border: 1px solid var(--accent);
      border-radius: 50% 50% 50% 0;
      background: var(--paper);
      box-shadow: 0 0 0 2px var(--paper);
      transform: rotate(45deg);
      transition: border-color .2s ease;
    }

    .timeline-row::before { top: 6px; }

    .timeline-time { display: inline-block; }

    .notes-block { margin-top: 3px; }

    .notes-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 48px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
      transition: color .15s ease;
    }

    .notes-toggle:hover { color: var(--accent); }

    .toggle-mark {
      display: inline-block;
      font-size: 15px;
      line-height: 1;
      transform: translateY(-1px);
      transition: transform .18s ease;
    }

    .notes-toggle[aria-expanded="true"] .toggle-mark {
      transform: translateY(1px) rotate(180deg);
    }

    .notes {
      margin: 5px 0 0;
      padding: 0;
      list-style: none;
    }

    .note {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px 0 8px;
      color: #444444;
      font-size: 14px;
      line-height: 1.55;
    }

    .task-timeline .note::before { bottom: 10px; }

    .task-timeline .notes-toggle { margin-left: 0; }

    .task-timeline .note time { align-self: flex-start; }

    .note-edit-slot { min-width: 0; }

    .note-text {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: text;
      font: inherit;
      line-height: inherit;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .note-text[hidden] { display: none; }

    .task-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin: 11px 0 0 48px;
    }

    .note-trigger,
    .note-cancel,
    .archive-button,
    .edit-cancel,
    .note-edit-submit,
    .note-edit-cancel,
    .delete-button,
    .delete-cancel {
      padding: 3px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
      transition: border-color .15s ease, color .15s ease;
    }

    .archive-button,
    .note-edit-cancel,
    .delete-button,
    .delete-cancel { color: var(--muted); }

    .task-category-control {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 28px;
      padding: 3px 0;
      color: var(--muted);
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
      line-height: 1;
      max-width: 104px;
    }

    .task-category-control:focus-within {
      color: var(--ink);
      outline: 1px solid var(--ink);
      outline-offset: 3px;
    }

    .task-category-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-category-chevron {
      flex: 0 0 6px;
      width: 6px;
      height: 6px;
      margin: -3px 1px 0 0;
      border-right: 1.2px solid currentColor;
      border-bottom: 1.2px solid currentColor;
      transform: rotate(45deg);
    }

    .task-category-select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
    }

    .note-trigger:hover,
    .note-cancel:hover,
    .archive-button:hover,
    .edit-cancel:hover,
    .note-edit-submit:hover,
    .note-edit-cancel:hover,
    .delete-button:hover,
    .delete-cancel:hover { border-bottom-color: currentColor; }

    .note-form {
      display: none;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      flex-basis: 100%;
      margin-top: 8px;
    }

    .note-form.is-open { display: grid; }

    .note-form input {
      min-height: 36px;
      padding: 4px 1px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
    }

    .note-form input:focus { border-color: var(--accent); }

    .edit-form,
    .note-edit-form {
      display: none;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
      margin: 0;
    }

    .edit-form {
      font-size: 18px;
      font-weight: 500;
      line-height: 1.5;
    }

    .note-edit-form {
      font-size: 14px;
      line-height: 1.55;
    }

    .edit-form.is-open,
    .note-edit-form.is-open { display: grid; }

    .edit-form input,
    .note-edit-form input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
    }

    .note-submit,
    .edit-submit,
    .delete-confirm-button {
      padding: 7px 13px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
    }

    .note-submit:hover,
    .edit-submit:hover { background: var(--accent-soft); }

    .delete-confirm {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-basis: 100%;
      margin-top: 8px;
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
    }

    .delete-confirm[hidden] { display: none; }

    .delete-confirm-button {
      background: var(--ink);
      color: var(--paper);
    }

    .task.is-done .task-title {
      color: #8a8a8a;
      text-decoration-line: line-through;
    }

    .task.is-done .edit-form input,
    .task.is-done .note-edit-form input { color: #8a8a8a; }

    .task.is-done .note,
    .task.is-done .note time,
    .task.is-done .timeline-time { color: #aaaaaa; }

    .task.is-done .notes-toggle { color: #a0a0a0; }

    .task.is-done .time-knot::after { border-color: #a0a0a0; }

    .task.is-done .task-timeline::before { background: #aaaaaa; }

    .task.is-done .timeline-row::before,
    .task.is-done .task-timeline .note::before { border-color: #a0a0a0; }

    .page-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin: 31px 0 24px;
    }

    .page-heading h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 500;
      letter-spacing: -.03em;
    }

    .page-heading p {
      margin: 0;
      color: var(--faint);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11px;
    }

    .category-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin-bottom: 34px;
    }

    .category-form input {
      min-height: 40px;
      padding: 4px 2px;
      border: 0;
      border-bottom: 1px solid var(--line);
      outline: 0;
      background: transparent;
      color: var(--ink);
    }

    .category-form input:focus { border-color: var(--accent); }

    .small-button {
      align-self: center;
      padding: 8px 15px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
    }

    .small-button:hover { background: var(--accent-soft); }

    .category-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .category-group {
      min-height: 148px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      transition: border-color .18s ease, transform .18s ease;
    }

    .category-group:hover {
      border-color: rgba(0, 0, 0, .32);
      transform: translateY(-1px);
    }

    .category-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .category-title h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
    }

    .category-count,
    .category-empty,
    .archive-meta {
      color: var(--faint);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11px;
    }

    .archive-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
    }

    .category-items,
    .archive-items,
    .trash-items {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .category-item {
      display: block;
      padding: 9px 0;
      color: #333333;
      font-size: 14px;
    }

    .category-item + .category-item { border-top: 1px solid rgba(0, 0, 0, .08); }

    .category-item.is-done .category-item-text {
      color: #8a8a8a;
      text-decoration: line-through;
    }

    .archive-content,
    .trash-content {
      padding-top: 2px;
      border-top: 1px solid var(--line);
    }

    .archive-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 0, 0, .1);
    }

    .archive-name {
      display: block;
      margin-bottom: 3px;
      color: #555555;
      font-size: 14px;
    }

    .restore-button,
    .trash-restore-button,
    .trash-delete-button,
    .trash-delete-confirm-button,
    .trash-delete-cancel {
      padding: 3px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
    }

    .trash-delete-button,
    .trash-delete-cancel { color: var(--muted); }

    .trash-delete-confirm-button { color: var(--ink); }

    .restore-button:hover,
    .trash-restore-button:hover,
    .trash-delete-button:hover,
    .trash-delete-confirm-button:hover,
    .trash-delete-cancel:hover { border-bottom-color: currentColor; }

    .trash-action-area {
      display: flex;
      justify-content: flex-end;
      min-width: 112px;
    }

    .trash-actions,
    .trash-delete-confirm {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .trash-delete-confirm {
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11px;
    }

    .trash-delete-confirm[hidden] { display: none; }

    .trash-actions[hidden] { display: none; }

    .status-message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 5;
      max-width: calc(100% - 40px);
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 6px 22px var(--shadow);
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
    }

    .empty {
      display: none;
      padding: 42px 0;
      color: var(--faint);
      text-align: center;
      font-size: 14px;
    }

    .empty.is-visible { display: block; }

    .hint {
      margin-top: 34px;
      color: var(--faint);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11px;
      line-height: 1.65;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 580px) {
      .shell {
        width: 100%;
        padding: max(30px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(54px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      header {
        align-items: start;
        padding-bottom: 20px;
      }

      h1 { font-size: 40px; }

      .eyebrow {
        margin-bottom: 8px;
        font-size: 10px;
      }

      .summary {
        padding-top: 8px;
        font-size: 11px;
      }

      .page-nav {
        gap: 24px;
        padding-top: 10px;
      }

      .page-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding-bottom: 8px;
      }

      .composer {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 13px;
        margin: 22px 0 34px;
      }

      .composer input { grid-column: 1 / -1; }

      .composer select { width: 120px; }

      .composer select,
      .task-category-select,
      .note-form input,
      .edit-form input,
      .note-edit-form input,
      .category-form input { font-size: 16px; }

      .add-button {
        justify-self: end;
        min-width: 84px;
      }

      .task-head {
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 10px;
      }

      .task-title { font-size: 17px; }

      .edit-form { font-size: 17px; }

      .task { padding-bottom: 29px; }

      .task + .task { padding-top: 24px; }

      .task-timeline,
      .task-actions { margin-left: 43px; }

      .task-actions { gap: 6px 14px; }

      .note {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .note-form {
        grid-template-columns: 1fr auto;
      }

      .note-form input { grid-column: 1 / -1; }

      .edit-form,
      .note-edit-form {
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
      }

      .page-heading {
        align-items: flex-start;
        margin: 25px 0 21px;
      }

      .page-heading h2 { font-size: 23px; }

      .page-heading p {
        max-width: 155px;
        padding-top: 2px;
        line-height: 1.45;
        text-align: right;
      }

      .category-form { margin-bottom: 29px; }

      .category-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .category-group {
        min-height: 0;
        padding: 14px;
        border-radius: 12px;
      }

      .category-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      .category-title h3 {
        font-size: 15px;
        overflow-wrap: anywhere;
      }

      .category-count { font-size: 10px; }

      .category-item {
        padding: 8px 0;
        font-size: 13px;
      }

      .archive-row { padding: 14px 0; }

      .trash-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .trash-action-area { justify-content: flex-start; }

      .trash-actions,
      .trash-delete-confirm { justify-content: flex-start; }

      .status-message {
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 360px) {
      .shell {
        padding-right: max(14px, env(safe-area-inset-right));
        padding-left: max(14px, env(safe-area-inset-left));
      }

      .page-nav { gap: 20px; }

      .task-actions { gap: 6px 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <span class="eyebrow">memo &amp; progress</span>
        <h1>一现</h1>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
    </header>

    <nav class="page-nav" aria-label="页面导航">
      <a href="#home" data-view-link="home">主页</a>
      <a href="#categories" data-view-link="categories">类别</a>
      <a href="#archive" data-view-link="archive">归档</a>
      <a href="#trash" data-view-link="trash">垃圾站</a>
    </nav>

    <section class="view" id="home-view" aria-labelledby="home-nav-label">
      <span id="home-nav-label" hidden>主页</span>
      <form class="composer" id="task-form">
        <label for="task-input" hidden>写下一个待办或想法</label>
        <input id="task-input" type="text" maxlength="160" autocomplete="off" placeholder="写下一件想做的事……" required>
        <label for="task-category" hidden>选择类别</label>
        <select id="task-category" aria-label="选择类别"></select>
        <button class="add-button" type="submit">记下来</button>
      </form>

      <ul class="task-list" id="task-list" aria-label="待办列表"></ul>
      <p class="empty" id="empty">这里暂时是空白的，写下第一件事吧。</p>
      <p class="hint">勾选方框可标记完成；归档后可从“归档”恢复，删除后会进入“垃圾站”。<br>每件事都可以反复“记进展”。</p>
    </section>

    <section class="view" id="categories-view" aria-labelledby="categories-title" hidden>
      <div class="page-heading">
        <h2 id="categories-title">类别</h2>
        <p>按类别回看正在进行的事</p>
      </div>

      <form class="category-form" id="category-form">
        <label for="category-input" hidden>新类别名称</label>
        <input id="category-input" type="text" maxlength="24" autocomplete="off" placeholder="新建一个类别……" required>
        <button class="small-button" type="submit">添加类别</button>
      </form>

      <div class="category-list" id="category-list"></div>
    </section>

    <section class="view" id="archive-view" aria-labelledby="archive-title" hidden>
      <div class="page-heading">
        <h2 id="archive-title">归档</h2>
        <p id="archive-count">0 条记录</p>
      </div>
      <div class="archive-content" id="archive-content"></div>
    </section>

    <section class="view" id="trash-view" aria-labelledby="trash-title" hidden>
      <div class="page-heading">
        <h2 id="trash-title" tabindex="-1">垃圾站</h2>
        <p id="trash-count">0 条记录</p>
      </div>
      <div class="trash-content" id="trash-content"></div>
    </section>
  </main>

  <div class="status-message" id="status-message" role="status" aria-live="polite" hidden></div>

  <script>
    (() => {
      document.title = "一现 · 待办与进展";
      const TASK_STORAGE_KEY = "liu-yi-bi-tasks-v2";
      const CATEGORY_STORAGE_KEY = "liu-yi-bi-categories-v1";
      const DEFAULT_CATEGORIES = [
        { id: "uncategorized", name: "未分类" },
        { id: "ideas", name: "灵感" },
        { id: "life", name: "生活" },
        { id: "work", name: "工作" }
      ];
      const example = [{
        id: "example-app-idea",
        text: "突然想做一个app",
        createdAt: "26/9/26 15:37",
        done: false,
        archived: false,
        categoryId: "ideas",
        notes: [{ id: "example-note", text: "在ai加持下尝试了一下", createdAt: "26/10/1 15:22" }]
      }];

      const taskForm = document.querySelector("#task-form");
      const taskInput = document.querySelector("#task-input");
      const taskCategory = document.querySelector("#task-category");
      const taskList = document.querySelector("#task-list");
      const summary = document.querySelector("#summary");
      const empty = document.querySelector("#empty");
      const homeView = document.querySelector("#home-view");
      const categoriesView = document.querySelector("#categories-view");
      const archiveView = document.querySelector("#archive-view");
      const trashView = document.querySelector("#trash-view");
      const categoryForm = document.querySelector("#category-form");
      const categoryInput = document.querySelector("#category-input");
      const categoryList = document.querySelector("#category-list");
      const archiveCount = document.querySelector("#archive-count");
      const archiveContent = document.querySelector("#archive-content");
      const trashCount = document.querySelector("#trash-count");
      const trashContent = document.querySelector("#trash-content");
      const statusMessage = document.querySelector("#status-message");

      let categories = loadCategories();
      let tasks = loadTasks().map(normalizeTask);
      let statusTimer;

      function loadTasks() {
        try {
          const stored = localStorage.getItem(TASK_STORAGE_KEY);
          return stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(example));
        } catch (_) {
          return JSON.parse(JSON.stringify(example));
        }
      }

      function saveTasks() {
        localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(tasks));
      }

      function loadCategories() {
        try {
          const stored = localStorage.getItem(CATEGORY_STORAGE_KEY);
          const parsed = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
          if (!parsed.some(category => category.id === "uncategorized")) {
            parsed.unshift({ id: "uncategorized", name: "未分类" });
          }
          return parsed;
        } catch (_) {
          return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
        }
      }

      function saveCategories() {
        localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(categories));
      }

      function normalizeTask(task) {
        const categoryExists = categories.some(category => category.id === task.categoryId);
        return {
          ...task,
          archived: Boolean(task.archived),
          deletedAt: typeof task.deletedAt === "string" ? task.deletedAt : "",
          categoryId: categoryExists
            ? task.categoryId
            : task.id === "example-app-idea" ? "ideas" : "uncategorized",
          notes: Array.isArray(task.notes) ? task.notes : []
        };
      }

      function makeId() {
        return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function formatNow(date = new Date()) {
        const yy = String(date.getFullYear()).slice(-2);
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const hour = String(date.getHours()).padStart(2, "0");
        const minute = String(date.getMinutes()).padStart(2, "0");
        return `${yy}/${month}/${day} ${hour}:${minute}`;
      }

      function recordedTime(value) {
        const match = String(value).match(/^(\d{2})\/(\d{1,2})\/(\d{1,2})\s+(\d{2}):(\d{2})$/);
        if (!match) return 0;
        const [, year, month, day, hour, minute] = match.map(Number);
        return new Date(2000 + year, month - 1, day, hour, minute).getTime();
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = String(value);
        return div.innerHTML;
      }

      function render() {
        const activeTasks = tasks
          .filter(task => !task.archived && !task.deletedAt)
          .slice()
          .sort((a, b) => recordedTime(a.createdAt) - recordedTime(b.createdAt));
        const openCount = activeTasks.filter(task => !task.done).length;
        const selectedCategory = taskCategory.value || "uncategorized";
        summary.textContent = `未完成 ${openCount} · 共 ${activeTasks.length}`;
        empty.classList.toggle("is-visible", activeTasks.length === 0);
        taskCategory.innerHTML = categoryOptions(selectedCategory);

        taskList.innerHTML = activeTasks.map(task => {
          const notes = task.notes.map(note => `
            <li class="note" data-note-id="${escapeHtml(note.id)}">
              <div class="note-edit-slot">
                <button class="note-text note-edit-trigger" type="button" aria-label="编辑进展：${escapeHtml(note.text)}">${escapeHtml(note.text)}</button>
                <form class="note-edit-form">
                  <input class="note-edit-input" type="text" maxlength="200" autocomplete="off" aria-label="编辑进展内容" required>
                  <button class="note-edit-submit" type="submit">保存</button>
                  <button class="note-edit-cancel" type="button">取消</button>
                </form>
              </div>
              <time datetime="${escapeHtml(note.createdAt)}">${escapeHtml(note.createdAt)}</time>
            </li>`).join("");

          return `
            <li class="task${task.done ? " is-done" : ""}" data-task-id="${task.id}">
              <div class="task-head">
                <label class="check-wrap" title="${task.done ? "恢复未完成" : "标记为完成"}">
                  <input class="task-check" type="checkbox" ${task.done ? "checked" : ""} aria-label="${task.done ? "恢复" : "完成"}：${escapeHtml(task.text)}">
                  <span class="checkmark" aria-hidden="true"></span>
                </label>
                <div class="task-title-slot">
                  <button class="task-title" type="button" aria-label="编辑待办：${escapeHtml(task.text)}">${escapeHtml(task.text)}</button>
                  <form class="edit-form">
                    <input class="edit-input" type="text" maxlength="160" autocomplete="off" aria-label="编辑待办内容" required>
                    <button class="edit-submit" type="submit">保存</button>
                    <button class="edit-cancel" type="button">取消</button>
                  </form>
                </div>
              </div>
              <div class="task-timeline">
                <div class="timeline-row">
                  <time class="timeline-time" datetime="${escapeHtml(task.createdAt)}">${escapeHtml(task.createdAt)}</time>
                </div>
                ${notes ? `
                  <div class="notes-block">
                    <button class="notes-toggle" type="button" aria-expanded="false" aria-controls="notes-${task.id}">
                      <span>${task.notes.length} 条进展</span>
                      <span class="toggle-mark" aria-hidden="true">⌄</span>
                    </button>
                    <ul class="notes" id="notes-${task.id}" aria-label="进展记录" hidden>${notes}</ul>
                  </div>` : ""}
              </div>
              <div class="task-actions">
                <button class="note-trigger" type="button">＋ 记进展</button>
                <span class="task-category-control">
                  <span class="task-category-label" aria-hidden="true">${escapeHtml(categoryName(task.categoryId))}</span>
                  <span class="task-category-chevron" aria-hidden="true"></span>
                  <select class="task-category-select" aria-label="更改“${escapeHtml(task.text)}”的类别">
                    ${categoryOptions(task.categoryId)}
                  </select>
                </span>
                <button class="archive-button" type="button">归档</button>
                <button class="delete-button" type="button">删除</button>
                <form class="note-form">
                  <input class="note-input" type="text" maxlength="200" autocomplete="off" placeholder="写下新的进展……" aria-label="写下新的进展" required>
                  <button class="note-submit" type="submit">记下</button>
                  <button class="note-cancel" type="button">取消</button>
                </form>
                <div class="delete-confirm" role="alert" hidden>
                  <span>将移入垃圾站，可随时恢复。</span>
                  <button class="delete-confirm-button" type="button">移入垃圾站</button>
                  <button class="delete-cancel" type="button">取消</button>
                </div>
              </div>
            </li>`;
        }).join("");

        renderCategories();
        renderArchive();
        renderTrash();
        syncView();
      }

      function categoryOptions(selectedId) {
        return categories.map(category => `
          <option value="${escapeHtml(category.id)}" ${category.id === selectedId ? "selected" : ""}>${escapeHtml(category.name)}</option>`).join("");
      }

      function categoryName(categoryId) {
        return categories.find(category => category.id === categoryId)?.name || "未分类";
      }

      function renderCategories() {
        const activeTasks = tasks.filter(task => !task.archived && !task.deletedAt);

        categoryList.innerHTML = categories.map(category => {
          const groupedTasks = activeTasks.filter(task => task.categoryId === category.id);
          const items = groupedTasks.map(task => `
            <li class="category-item${task.done ? " is-done" : ""}">
              <span class="category-item-text">${escapeHtml(task.text)}</span>
            </li>`).join("");

          return `
            <section class="category-group">
              <div class="category-title">
                <h3>${escapeHtml(category.name)}</h3>
                <span class="category-count">${groupedTasks.length} 件</span>
              </div>
              ${items ? `<ul class="category-items">${items}</ul>` : `<span class="category-empty">暂无待办</span>`}
            </section>`;
        }).join("");
      }

      function renderArchive() {
        const archivedTasks = tasks.filter(task => task.archived && !task.deletedAt);

        archiveCount.textContent = `${archivedTasks.length} 条记录`;
        archiveContent.innerHTML = archivedTasks.length ? `
          <ul class="archive-items">
            ${archivedTasks.map(task => `
              <li class="archive-row" data-task-id="${task.id}">
                <div>
                  <span class="archive-name">${escapeHtml(task.text)}</span>
                  <span class="archive-meta">
                    <span>${escapeHtml(categoryName(task.categoryId))}</span>
                    <time class="time-knot" datetime="${escapeHtml(task.createdAt)}">${escapeHtml(task.createdAt)}</time>
                  </span>
                </div>
                <button class="restore-button" type="button">恢复</button>
              </li>`).join("")}
          </ul>` : `<p class="category-empty">还没有归档的待办。</p>`;
      }

      function renderTrash() {
        const deletedTasks = tasks
          .filter(task => task.deletedAt)
          .slice()
          .sort((a, b) => recordedTime(b.deletedAt) - recordedTime(a.deletedAt));

        trashCount.textContent = `${deletedTasks.length} 条记录`;
        trashContent.innerHTML = deletedTasks.length ? `
          <ul class="trash-items">
            ${deletedTasks.map(task => `
              <li class="archive-row trash-row" data-task-id="${escapeHtml(task.id)}">
                <div>
                  <span class="archive-name">${escapeHtml(task.text)}</span>
                  <span class="archive-meta">
                    <span>${escapeHtml(categoryName(task.categoryId))}</span>
                    <span>删除于 ${escapeHtml(task.deletedAt)}</span>
                  </span>
                </div>
                <div class="trash-action-area">
                  <div class="trash-actions">
                    <button class="trash-restore-button" type="button">恢复</button>
                    <button class="trash-delete-button" type="button">彻底删除</button>
                  </div>
                  <div class="trash-delete-confirm" role="alert" hidden>
                    <span>删除后无法恢复</span>
                    <button class="trash-delete-confirm-button" type="button">确定</button>
                    <button class="trash-delete-cancel" type="button">取消</button>
                  </div>
                </div>
              </li>`).join("")}
          </ul>` : `<p class="category-empty">垃圾站是空的。</p>`;
      }

      function syncView() {
        const view = location.hash === "#categories"
          ? "categories"
          : location.hash === "#archive"
            ? "archive"
            : location.hash === "#trash" ? "trash" : "home";
        homeView.hidden = view !== "home";
        categoriesView.hidden = view !== "categories";
        archiveView.hidden = view !== "archive";
        trashView.hidden = view !== "trash";
        document.querySelectorAll("[data-view-link]").forEach(link => {
          const active = link.dataset.viewLink === view;
          link.classList.toggle("is-active", active);
          if (active) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        });
      }

      function showStatus(message) {
        clearTimeout(statusTimer);
        statusMessage.textContent = message;
        statusMessage.hidden = false;
        statusTimer = setTimeout(() => {
          statusMessage.hidden = true;
        }, 2600);
      }

      function focusCaretAtEnd(input) {
        const end = input.value.length;
        input.focus();
        input.setSelectionRange(end, end);
        input.scrollLeft = input.scrollWidth;
      }

      taskForm.addEventListener("submit", event => {
        event.preventDefault();
        const text = taskInput.value.trim();
        if (!text) return;
        tasks.push({
          id: makeId(),
          text,
          createdAt: formatNow(),
          done: false,
          archived: false,
          deletedAt: "",
          categoryId: taskCategory.value || "uncategorized",
          notes: []
        });
        saveTasks();
        render();
        taskInput.value = "";
        taskInput.focus();
      });

      taskList.addEventListener("change", event => {
        const taskElement = event.target.closest(".task");
        if (!taskElement) return;
        const task = tasks.find(item => item.id === taskElement.dataset.taskId);
        if (!task) return;

        if (event.target.matches(".task-check")) task.done = event.target.checked;
        else if (event.target.matches(".task-category-select")) task.categoryId = event.target.value;
        else return;

        saveTasks();
        render();
      });

      taskList.addEventListener("click", event => {
        const taskElement = event.target.closest(".task");
        if (!taskElement) return;
        const form = taskElement.querySelector(".note-form");

        const notesToggle = event.target.closest(".notes-toggle");
        if (notesToggle) {
          const notesList = taskElement.querySelector(".notes");
          const willExpand = notesToggle.getAttribute("aria-expanded") !== "true";
          notesToggle.setAttribute("aria-expanded", String(willExpand));
          notesList.hidden = !willExpand;
        }

        if (event.target.closest(".note-trigger")) {
          closeEditForm(taskElement, false);
          closeNoteEdits(taskElement);
          closeDeleteConfirm(taskElement, false);
          form.classList.add("is-open");
          event.target.closest(".note-trigger").hidden = true;
          form.querySelector("input").focus();
        }

        if (event.target.closest(".note-cancel")) closeNoteForm(taskElement);

        if (event.target.closest(".task-title")) {
          closeNoteForm(taskElement, false);
          closeNoteEdits(taskElement);
          closeDeleteConfirm(taskElement, false);
          const task = tasks.find(item => item.id === taskElement.dataset.taskId);
          if (!task) return;
          const editForm = taskElement.querySelector(".edit-form");
          const editInput = editForm.querySelector(".edit-input");
          editInput.value = task.text;
          editForm.classList.add("is-open");
          taskElement.querySelector(".task-title").hidden = true;
          focusCaretAtEnd(editInput);
        }

        if (event.target.closest(".edit-cancel")) closeEditForm(taskElement);

        const noteEditTrigger = event.target.closest(".note-edit-trigger");
        if (noteEditTrigger) {
          const noteElement = noteEditTrigger.closest(".note");
          const task = tasks.find(item => item.id === taskElement.dataset.taskId);
          const note = task?.notes.find(item => item.id === noteElement.dataset.noteId);
          if (!note) return;
          closeNoteForm(taskElement, false);
          closeEditForm(taskElement, false);
          closeNoteEdits(taskElement);
          closeDeleteConfirm(taskElement, false);
          const noteEditForm = noteElement.querySelector(".note-edit-form");
          const noteEditInput = noteEditForm.querySelector(".note-edit-input");
          noteEditInput.value = note.text;
          noteEditForm.classList.add("is-open");
          noteEditTrigger.hidden = true;
          focusCaretAtEnd(noteEditInput);
        }

        if (event.target.closest(".note-edit-cancel")) {
          closeNoteEdit(event.target.closest(".note"));
        }

        if (event.target.closest(".delete-button")) {
          closeNoteForm(taskElement, false);
          closeEditForm(taskElement, false);
          closeNoteEdits(taskElement);
          const confirmation = taskElement.querySelector(".delete-confirm");
          confirmation.hidden = false;
          taskElement.querySelector(".delete-button").hidden = true;
          confirmation.querySelector(".delete-confirm-button").focus();
        }

        if (event.target.closest(".delete-cancel")) closeDeleteConfirm(taskElement);

        if (event.target.closest(".delete-confirm-button")) {
          const task = tasks.find(item => item.id === taskElement.dataset.taskId);
          if (!task) return;
          task.deletedAt = formatNow();
          saveTasks();
          render();
          (taskList.querySelector(".task-title") || taskInput).focus();
          showStatus("已移入垃圾站");
          return;
        }

        if (event.target.closest(".archive-button")) {
          const task = tasks.find(item => item.id === taskElement.dataset.taskId);
          if (!task) return;
          task.archived = true;
          saveTasks();
          render();
          showStatus("已归档，可在“归档”页面恢复");
        }
      });

      taskList.addEventListener("submit", event => {
        event.preventDefault();
        const taskElement = event.target.closest(".task");
        const task = tasks.find(item => item.id === taskElement.dataset.taskId);
        if (!task) return;

        if (event.target.matches(".note-form")) {
          const input = event.target.querySelector(".note-input");
          const text = input.value.trim();
          if (!text) return;
          task.notes.push({ id: makeId(), text, createdAt: formatNow() });
          saveTasks();
          render();
          return;
        }

        if (event.target.matches(".edit-form")) {
          const input = event.target.querySelector(".edit-input");
          const text = input.value.trim();
          if (!text) return;
          task.text = text;
          saveTasks();
          render();
          showStatus("已更新待办");
          return;
        }

        if (event.target.matches(".note-edit-form")) {
          const noteElement = event.target.closest(".note");
          const note = task.notes.find(item => item.id === noteElement.dataset.noteId);
          const input = event.target.querySelector(".note-edit-input");
          const text = input.value.trim();
          if (!note || !text) return;
          note.text = text;
          saveTasks();
          const trigger = noteElement.querySelector(".note-edit-trigger");
          trigger.textContent = text;
          trigger.setAttribute("aria-label", `编辑进展：${text}`);
          closeNoteEdit(noteElement, false);
          trigger.focus();
          showStatus("已更新进展，原时间已保留");
        }
      });

      taskList.addEventListener("keydown", event => {
        if (event.key === "Escape" && event.target.matches(".note-input")) {
          closeNoteForm(event.target.closest(".task"));
        }
        if (event.key === "Escape" && event.target.matches(".edit-input")) {
          closeEditForm(event.target.closest(".task"));
        }
        if (event.key === "Escape" && event.target.matches(".note-edit-input")) {
          closeNoteEdit(event.target.closest(".note"));
        }
      });

      categoryForm.addEventListener("submit", event => {
        event.preventDefault();
        const name = categoryInput.value.trim();
        if (!name) return;
        const duplicate = categories.some(category => category.name.toLocaleLowerCase() === name.toLocaleLowerCase());
        if (duplicate) {
          showStatus("这个类别已经存在");
          categoryInput.select();
          return;
        }
        const category = { id: `cat-${makeId()}`, name };
        categories.push(category);
        saveCategories();
        categoryInput.value = "";
        render();
        taskCategory.value = category.id;
        showStatus(`已添加类别“${name}”`);
      });

      archiveContent.addEventListener("click", event => {
        const restoreButton = event.target.closest(".restore-button");
        if (!restoreButton) return;
        const row = restoreButton.closest(".archive-row");
        const task = tasks.find(item => item.id === row.dataset.taskId);
        if (!task) return;
        task.archived = false;
        saveTasks();
        render();
        showStatus("已恢复到主页");
      });

      trashContent.addEventListener("click", event => {
        const row = event.target.closest(".trash-row");
        if (!row) return;
        const task = tasks.find(item => item.id === row.dataset.taskId);
        if (!task) return;

        if (event.target.closest(".trash-restore-button")) {
          task.deletedAt = "";
          task.archived = false;
          saveTasks();
          render();
          document.querySelector("#trash-title").focus();
          showStatus("已恢复到主页");
          return;
        }

        if (event.target.closest(".trash-delete-button")) {
          row.querySelector(".trash-actions").hidden = true;
          const confirmation = row.querySelector(".trash-delete-confirm");
          confirmation.hidden = false;
          confirmation.querySelector(".trash-delete-confirm-button").focus();
          return;
        }

        if (event.target.closest(".trash-delete-cancel")) {
          row.querySelector(".trash-delete-confirm").hidden = true;
          row.querySelector(".trash-actions").hidden = false;
          row.querySelector(".trash-delete-button").focus();
          return;
        }

        if (event.target.closest(".trash-delete-confirm-button")) {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
          document.querySelector("#trash-title").focus();
          showStatus("已彻底删除");
        }
      });

      window.addEventListener("hashchange", syncView);

      function closeNoteForm(taskElement, restoreFocus = true) {
        const form = taskElement.querySelector(".note-form");
        form.reset();
        form.classList.remove("is-open");
        const trigger = taskElement.querySelector(".note-trigger");
        trigger.hidden = false;
        if (restoreFocus) trigger.focus();
      }

      function closeEditForm(taskElement, restoreFocus = true) {
        const form = taskElement.querySelector(".edit-form");
        form.reset();
        form.classList.remove("is-open");
        const trigger = taskElement.querySelector(".task-title");
        trigger.hidden = false;
        if (restoreFocus) trigger.focus();
      }

      function closeNoteEdit(noteElement, restoreFocus = true) {
        const form = noteElement.querySelector(".note-edit-form");
        form.reset();
        form.classList.remove("is-open");
        const trigger = noteElement.querySelector(".note-edit-trigger");
        trigger.hidden = false;
        if (restoreFocus) trigger.focus();
      }

      function closeNoteEdits(taskElement) {
        taskElement.querySelectorAll(".note-edit-form.is-open").forEach(form => {
          closeNoteEdit(form.closest(".note"), false);
        });
      }

      function closeDeleteConfirm(taskElement, restoreFocus = true) {
        taskElement.querySelector(".delete-confirm").hidden = true;
        const trigger = taskElement.querySelector(".delete-button");
        trigger.hidden = false;
        if (restoreFocus) trigger.focus();
      }

      render();
    })();
  </script>
</body>
</html>
